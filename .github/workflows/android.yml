name: Android

on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build debug APK and release bundle
        shell: bash
        run: |
          set -o pipefail
          gradle -p android assembleDebug bundleRelease --stacktrace 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: takeoff-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Post build log on failure
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          LOG_PATH: ${{ runner.temp }}/build.log
        with:
          script: |
            const fs = require('fs');
            const path = process.env.LOG_PATH;
            const log = fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : 'No build log was written.';
            const lines = log.split('\n');
            const errors = lines
              .filter(l => /^e: |error:|What went wrong|FAILURE:|Could not resolve|^> (?!Task)|^\s+> /.test(l))
              .slice(0, 60)
              .join('\n');
            const tail = lines.slice(-150).join('\n');
            const fence = (s) => '```\n' + s.replace(/```/g, "'''").slice(-30000) + '\n```';
            const body = [
              '### Android build failed',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '#### Error lines',
              fence(errors || '(none matched)'),
              '#### Last 150 lines',
              fence(tail)
            ].join('\n\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

  release:
    name: Release to Play internal testing
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_SECRETS: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' && secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Skip when Play secrets are missing
        if: env.HAS_SECRETS != 'true'
        run: echo "::notice::Play / signing secrets are not set, so the release is skipped."

      - uses: actions/checkout@v4
        if: env.HAS_SECRETS == 'true'

      - uses: actions/setup-java@v4
        if: env.HAS_SECRETS == 'true'
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        if: env.HAS_SECRETS == 'true'
        with:
          gradle-version: 8.11.1

      - name: Decode keystore
        if: env.HAS_SECRETS == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build signed release bundle
        if: env.HAS_SECRETS == 'true'
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle -p android bundleRelease --stacktrace

      - name: Upload to Play (internal track)
        if: env.HAS_SECRETS == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.jashparekh.takeoff
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: ${{ vars.PLAY_RELEASE_STATUS || 'draft' }}

      - name: Keep signed bundle
        if: env.HAS_SECRETS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: takeoff-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
