name: iOS

on:
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (simulator)
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcode-select -p
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate app icon
        run: python3 ios/scripts/make_icon.py

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project Takeoff.xcodeproj -scheme Takeoff \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log

      - name: Post build log to PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync('ios/build.log', 'utf8'); }
            catch (e) { log = '(no ios/build.log: the job failed before the xcodebuild step; see the Actions run)'; }
            const lines = log.split('\n');
            const errs = [...new Set(lines.filter(l => /error:|\*\* BUILD FAILED|fatal error/i.test(l)))].slice(0, 70);
            const tail = lines.slice(-Math.max(80, 150 - errs.length));
            let body = '### iOS build failed\n\n' +
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n` +
              '**error: lines**\n```\n' + (errs.join('\n') || '(none)') + '\n```\n' +
              '**Log tail**\n```\n' + tail.join('\n') + '\n```\n';
            if (body.length > 60000) body = body.slice(0, 60000) + '\n```\n(truncated)';
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body,
            });

  release:
    name: TestFlight
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    timeout-minutes: 60
    env:
      HAS_SECRETS: ${{ secrets.ASC_KEY_P8 != '' }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - name: Release secrets missing
        if: env.HAS_SECRETS != 'true'
        run: echo "::notice::ASC_KEY_P8 not set; skipping TestFlight upload. Add APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8 to enable it."

      - uses: actions/checkout@v4
        if: env.HAS_SECRETS == 'true'

      - name: Select newest Xcode
        if: env.HAS_SECRETS == 'true'
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Install XcodeGen
        if: env.HAS_SECRETS == 'true'
        run: brew install xcodegen

      - name: Generate icon and project
        if: env.HAS_SECRETS == 'true'
        run: |
          python3 ios/scripts/make_icon.py
          cd ios && xcodegen generate

      - name: Write App Store Connect API key
        if: env.HAS_SECRETS == 'true'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/private_keys
          printf '%s\n' "$ASC_KEY_P8" > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          chmod 600 ~/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Archive
        if: env.HAS_SECRETS == 'true'
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild archive -project Takeoff.xcodeproj -scheme Takeoff \
            -destination 'generic/platform=iOS' \
            -archivePath build/Takeoff.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" BUILD_NUMBER="$GITHUB_RUN_NUMBER" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tee archive.log

      - name: Export and upload to TestFlight
        if: env.HAS_SECRETS == 'true'
        working-directory: ios
        run: |
          set -o pipefail
          cp ExportOptions.plist build/ExportOptions.plist
          plutil -replace teamID -string "$APPLE_TEAM_ID" build/ExportOptions.plist
          xcodebuild -exportArchive \
            -archivePath build/Takeoff.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tee export.log

      - name: Upload logs
        if: always() && env.HAS_SECRETS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-logs
          path: |
            ios/archive.log
            ios/export.log
          if-no-files-found: ignore

      - name: Remove API key
        if: always()
        run: rm -rf ~/private_keys
